# Default preferences for herald
# Copy to ~/.config/herald/prefs.toml and customize

[llm]
model = "claude-sonnet-5"
# Output token ceiling per API call. Gateway models that emit reasoning tokens
# share this budget with the draft, so leave headroom above the ~100-200 token
# report. Must not exceed the model's or gateway's output limit: a truncated
# response is retried at twice this value. See DEFAULT_MAX_TOKENS in config.py.
# max_tokens = 8192
# Coding agent CLI for the "request changes" feature (i).
# When set, revisions are handled by this agent — it can search GitHub,
# fetch PR details, etc.  Supported values: "claude", "pi", "opencode".
# When unset, revisions use a single Anthropic API call (no GitHub access).
# coding_agent = "claude"

writing_rules = [
  "No fractions or ratios like 7/8 or 4/25",
  "No completion percentages",
  "RITS/paused items go in Risks section, not Status summary",
  "Include Release Pending features as Green items",
]

[jira]
url = "https://redhat.atlassian.net"
# skills_dir is optional. When unset the app resolves it in order:
#   1. HERALD_SKILLS_DIR env var
#   2. Previously auto-fetched copy in the platform data directory
#   3. Repo-relative path (when running directly from the source tree)
#   4. Auto git-clone of openshift-eng/ai-helpers into the data directory
# Uncomment and set if you want to pin a specific local checkout:
# skills_dir = "~/src/ai-helpers/plugins/jira/skills/status-analysis"

[profiles.ocpstrat-hcp]
project = "OCPSTRAT"
component = "Hosted Control Planes"
label = "control-plane-work"
exclude = ["davegord@redhat.com", "aambewad@redhat.com"]
